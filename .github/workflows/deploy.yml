name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_ANALYTICS_PROVIDER: ${{ vars.NEXT_PUBLIC_ANALYTICS_PROVIDER }}
      NEXT_PUBLIC_ANALYTICS_ID: ${{ vars.NEXT_PUBLIC_ANALYTICS_ID }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      # O basePath sai desta URL. Sem ela, o site subiria sem CSS e sem JS.
      - name: Define a URL pública do site
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ -z "$PAGES_BASE_URL" ]; then
            echo "::error::configure-pages não retornou base_url; o build sairia sem basePath."
            exit 1
          fi
          echo "NEXT_PUBLIC_SITE_URL=$PAGES_BASE_URL" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          # LTS mais nova; o mínimo suportado (engines e .node-version) continua sendo o 24.
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
